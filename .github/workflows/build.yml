name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp on the build. Leave empty for a development build.
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    outputs:
      version:
        description: The version the build was stamped with.
        value: ${{ jobs.publish.outputs.version }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  APP_ID: io.github.adds39939.Titanite

jobs:
  publish:
    name: Build, test and publish
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Decide the version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          version="$REQUESTED"
          if [ -z "$version" ]; then
            base="$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)"
            version="${base}-dev.${GITHUB_RUN_NUMBER}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a version this build can be stamped with."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install the .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore the package cache
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Test
        run: dotnet test Titanite.slnx --configuration Release -p:Version=${{ steps.version.outputs.version }}

      - name: Publish
        run: >
          dotnet publish src/Titanite.App/Titanite.App.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained
          -p:Version=${{ steps.version.outputs.version }}
          --output artifacts/publish

      - name: Upload the published application
        uses: actions/upload-artifact@v7
        with:
          name: publish
          path: artifacts/publish
          if-no-files-found: error
          retention-days: 1

  flatpak:
    name: Build the Flatpak
    needs: publish
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Download the published application
        uses: actions/download-artifact@v8
        with:
          name: publish
          path: artifacts/publish

      - name: Restore the executable bit
        run: chmod +x artifacts/publish/Titanite.App

      - name: Stamp the release into the metainfo
        run: >
          sed -i
          -e "s/@VERSION@/${{ needs.publish.outputs.version }}/"
          -e "s/@DATE@/$(date -u +%Y-%m-%d)/"
          packaging/flatpak/${APP_ID}.metainfo.xml

      - name: Build the bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/${{ env.APP_ID }}.yml
          bundle: Titanite-${{ needs.publish.outputs.version }}-x86_64.flatpak
          artifact-name: flatpak
