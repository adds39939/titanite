name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Read the version from the tag
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Read the version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tags must look like v1.2, v1.2.3 or v1.2.3-alpha, not ${GITHUB_REF_NAME}."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}

  release:
    name: Create the GitHub release
    needs: [ version, build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download the bundle
        uses: actions/download-artifact@v8
        with:
          name: flatpak
          path: dist

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          name: Titanite ${{ needs.version.outputs.version }}
          files: dist/*.flatpak
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
