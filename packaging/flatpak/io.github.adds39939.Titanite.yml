id: io.github.adds39939.Titanite
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: titanite

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=home
  - --filesystem=/mnt:ro
  - --filesystem=/media:ro
  - --filesystem=/run/media:ro
  - --talk-name=org.freedesktop.Flatpak

modules:
  - name: titanite
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/titanite
      - cp -a publish/. /app/lib/titanite/
      - install -Dm755 titanite.sh /app/bin/titanite
      - install -Dm644 ${FLATPAK_ID}.desktop /app/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml /app/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 publish/wwwroot/titanite-icon.png /app/share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png
    sources:
      - type: dir
        path: ../../artifacts/publish
        dest: publish
      - type: file
        path: titanite.sh
      - type: file
        path: io.github.adds39939.Titanite.desktop
      - type: file
        path: io.github.adds39939.Titanite.metainfo.xml
